
name: Aegis-Noesis Tests

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Repository laden
        uses: actions/checkout@v4

      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Abhaengigkeiten installieren
        run: npm install --no-audit --no-fund

      - name: 13 Tests ausfuehren
        run: node --experimental-strip-types --test src/lib/binance.test.ts src/lib/paper-trade.test.ts

      - name: TypeScript pruefen
        run: npx --no-install tsc --noEmit
